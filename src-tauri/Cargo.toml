[package]
name = "memoria"
version = "0.1.6"
description = "가볍고 빠른 동기화 메모 위젯"
edition = "2021"

[lib]
name = "memoria_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1" # tauri.conf.json의 plugins 설정을 generate_context!가 펼칠 때 쓴다
tokio = { version = "1", features = ["net", "io-util", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
url = "2"

# 같은 귀퉁이에 있는 다른 위젯(Claude Widget) 창의 위치(neighbor.rs)와 마우스 버튼 상태(mouse.rs)를 읽는다
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

# 바이너리 크기 최소화
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
